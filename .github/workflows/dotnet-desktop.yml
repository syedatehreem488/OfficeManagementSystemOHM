name: Build ASP.NET Core

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OfficeManagementSystem.sln

      - name: Build
        run: dotnet build OfficeManagementSystem.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish OfficeManagementSystem.sln -c Release -o publish
